[package]
name = "mpvc"
version = "1.4.9"
authors = ["neeshy <neeshy@tfwno.gf>", "Jonas Frei <freijon@pm.me>"]
description = "An mpc-like CLI tool for mpv"
homepage = "https://github.com/neeshy/mpvc"
repository = "https://github.com/neeshy/mpvc.git"
license = "GPL-3.0-only"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
clap_complete = "4.6.12"
colored = "3.1.1"
log = "0.4.35"
serde = "1.0.229"
serde_json = "1.0.154"

[dev-dependencies]
env_logger = "0.11.11"
notify = "8.2.2"
